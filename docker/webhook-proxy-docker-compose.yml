services:
  webhook-proxy:
    build: .
    container_name: jumbo-webhook-proxy
    ports:
      - 127.0.0.1:3001:3001
    env_file:
      - .env
    environment:
      PG_DATABASE_URL: ${PG_DATABASE_URL}
      TWENTY_API_URL: http://twenty-server-1:3000/graphql
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - twenty_default
    restart: unless-stopped

networks:
  twenty_default:
    external: true
