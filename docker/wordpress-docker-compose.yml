name: wordpress

services:
  wp:
    image: wordpress:6.8-php8.3-fpm-alpine
    volumes:
      - wp-data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: wp-db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
    depends_on:
      wp-db:
        condition: service_healthy
    restart: always
    mem_limit: 256m

  wp-db:
    image: mariadb:11
    volumes:
      - wp-db-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    # Aggressive memory tuning for 4GB VPS already running Twenty + Temporal
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=16M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --key-buffer-size=32M
      --max-connections=30
      --query-cache-size=16M
      --tmp-table-size=32M
      --max-heap-table-size=32M
      --thread-cache-size=4
      --table-open-cache=400
      --performance-schema=OFF
    mem_limit: 320m

  # Nginx serves PHP via FastCGI to wp container
  wp-nginx:
    image: nginx:1.27-alpine
    volumes:
      - wp-data:/var/www/html:ro
      - ./nginx-wp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wp
    ports:
      - "127.0.0.1:8081:80"
    restart: always
    mem_limit: 32m

volumes:
  wp-data:
  wp-db-data:
